name: Build & push app images

# Builds the player and admin images natively on arm64 (free runners for
# public repos) and pushes them to GHCR. Nothing on the hosts builds or
# pulls by hand: the proxy dashboard owns the prod player and admin
# containers and rolls them when it sees the new digest (docs/ops/RUNBOOK.md).
#
# NEXT_PUBLIC_* values are baked into the client bundle at build time, so
# they are build args here. They are public-by-design (URLs + Supabase anon
# key) but live in repo secrets/vars so environments can change without
# editing this file.

on:
  push:
    branches:
      # Only the production branch moves the `latest` tag the Pi tracks.
      - deploy/docker-prod
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Two quick pushes used to start two builds that raced to move `latest`, and
# the slower one won. The Pi tracks `latest`, so losing that race deploys the
# older commit. Cancel the superseded build instead.
concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The Pi auto-updates from `latest`, so publishing an image IS deploying it.
  # Run the full type-check/lint/test suite first and let `needs` refuse to
  # build when it fails. Costs a few minutes of serial latency on every deploy;
  # the alternative is what happened tonight, where a red suite shipped because
  # nothing between the push and the Pi ever looked at it.
  verify:
    uses: ./.github/workflows/ci.yml

  build:
    needs: verify
    runs-on: ubuntu-24.04-arm
    strategy:
      # A failing leg must not cancel the others mid-push: each leg moves its
      # own `latest`, so a cancelled sibling would leave prod half advanced.
      fail-fast: false
      matrix:
        app: [player, admin, bot, data-api]
        # Overlay, not a third image: adds base_path to the `admin` combination
        # only. Next bakes basePath in at build time, so the console's mount
        # point (/admin, same origin as the player app) has to be a build arg —
        # see apps/admin/next.config.js. base_path is unset, hence empty, for
        # the player.
        include:
          - app: admin
            base_path: /admin
          # The data API has its own Dockerfile (no Next.js builder); the root
          # Dockerfile stays the default for the other three.
          - app: data-api
            dockerfile: apps/data-api/Dockerfile
          # The bot too: one tsc run, no Next.js builder.
          - app: bot
            dockerfile: apps/bot/Dockerfile
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/badminton-${{ matrix.app }}
          # Every build is tagged twice:
          #   latest       — the moving tag the Pi/dashboard tracks
          #   sha-<commit> — immutable, for rollback / pinning a known-good build
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile || 'Dockerfile' }}
          target: runner-${{ matrix.app }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }},mode=max
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_APP_URL=${{ secrets.NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_PLAYER_URL=${{ secrets.NEXT_PUBLIC_PLAYER_URL }}
            NEXT_PUBLIC_ADMIN_URL=${{ secrets.NEXT_PUBLIC_ADMIN_URL }}
            NEXT_PUBLIC_BASE_PATH=${{ matrix.base_path }}
            # The root Dockerfile compiles only this image's app (ignored by
            # the bot's and data API's own Dockerfiles).
            BUILD_APP=${{ matrix.app }}
            NEXT_PUBLIC_PASSKEY_RP_ID=${{ secrets.NEXT_PUBLIC_PASSKEY_RP_ID }}
            NEXT_PUBLIC_AUTH_COOKIE_DOMAIN=${{ secrets.NEXT_PUBLIC_AUTH_COOKIE_DOMAIN }}
            NEXT_PUBLIC_VAPID_PUBLIC_KEY=${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
            NEXT_PUBLIC_SENTRY_DSN=${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
            NEXT_PUBLIC_POSTHOG_KEY=${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
            NEXT_PUBLIC_POSTHOG_HOST=${{ secrets.NEXT_PUBLIC_POSTHOG_HOST }}
            SENTRY_ORG=${{ secrets.SENTRY_ORG }}
            SENTRY_PROJECT=${{ secrets.SENTRY_PROJECT }}
          # A build secret, not a build-arg, so the token never lands in the
          # image history or the build cache. See the Dockerfile's builder stage.
          secrets: |
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}
