name: Build & push staging images

# Staging counterpart to build-images.yml. Pushes the `staging` tag, which the
# staging containers on the Pi track — proxy-manager's auto-updater watches each
# container's own image reference (cmd/dashboard/autoupdate.go), so a new digest
# on :staging replaces the staging containers and nothing else.
#
# Why a separate build rather than reusing the production image: every
# NEXT_PUBLIC_* value is a build arg, inlined into the client bundle. The
# production image has production's Supabase URL compiled into it, so pointing
# it at a staging .env would move only the server and leave every browser-side
# query aimed at the production database.
#
# Gated on the same reusable suite production uses — but with an escape hatch,
# because the old ungated behaviour was a considered choice and not an
# oversight. Staging is where you go to find out whether something works, so
# refusing to deploy a red commit would remove the one place it is safe to look
# at one. What was missing was the DELIBERATE part: `docker build` catches a
# compile error and nothing else, so a red lint or test reached staging by
# default rather than by decision. A push now runs CI first; `workflow_dispatch`
# skips it, which is how you ship a knowingly-red commit when debugging.

on:
  push:
    branches:
      # The staging branch is the normal way in.
      - deploy/docker-staging
      # Production too: staging should never be behind what is live, or it stops
      # being a rehearsal of it.
      - deploy/docker-prod
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-staging
  cancel-in-progress: true

jobs:
  # The same reusable suite build-images.yml calls. Skipped on
  # workflow_dispatch — that is the override, and it is the only way past this
  # gate, so shipping red to staging stays possible but has to be chosen.
  #
  # CONCURRENCY, which is the sharp edge here. ci.yml groups itself as
  # `ci-${{ github.workflow }}-${{ github.ref }}` with cancel-in-progress, and a
  # push to deploy/docker-prod now starts TWO callers of it on the same ref
  # (build-images.yml and this file). They do not collide: GitHub documents that
  # inside a called workflow "the `github` context is always associated with the
  # caller workflow", so github.workflow resolves to each caller's own name and
  # the two groups differ by it. If that ever stopped holding, cancel-in-progress
  # would kill one `verify` job, `needs: verify` would refuse to build, and a
  # production deploy would silently not ship — so if you rename either workflow,
  # keep the two names distinct.
  verify:
    if: github.event_name != 'workflow_dispatch'
    uses: ./.github/workflows/ci.yml

  build:
    needs: verify
    # `always()` is required or this is skipped whenever verify is, which is
    # every workflow_dispatch. 'skipped' therefore means "dispatched on
    # purpose"; a real failure or a cancellation leaves a different result and
    # stops the build. Nothing here can deadlock: verify either runs to a
    # terminal state or is skipped outright, and both are covered.
    if: always() && (needs.verify.result == 'success' || needs.verify.result == 'skipped')
    runs-on: ubuntu-24.04-arm
    # The tag metadata-action actually generated, handed to `publish` so that
    # job never has to reconstruct it from github.sha and get the convention
    # wrong. A matrix job's outputs are last-writer-wins across legs, which is
    # normally a trap; here it is safe because `version` is the tag VALUE and
    # both legs produce the identical string — only the image name differs.
    outputs:
      version: ${{ steps.meta.outputs.version }}
    strategy:
      matrix:
        app: [player, admin, bot, data-api, data-api-rs]
        include:
          - app: admin
            base_path: /admin
          - app: data-api
            dockerfile: apps/data-api/Dockerfile
          # The bot too: one tsc run, no Next.js builder.
          - app: bot
            dockerfile: apps/bot/Dockerfile
          # The Rust Data API (1.1.0b), run on staging beside the TypeScript
          # one so the two can be compared on the same host and data.
          - app: data-api-rs
            dockerfile: apps/data-api-rs/Dockerfile
    steps:
      - uses: actions/checkout@v7

      # Fail loudly and early. A missing anon key would otherwise produce a
      # perfectly successful build whose client bundle cannot reach any
      # database, and the failure would only surface in a browser.
      - name: Check staging anon key is configured
        env:
          KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::STAGING_SUPABASE_ANON_KEY is not set. It is the anon key from" \
                 "/mnt/ssd/Deploy/supabase-staging/.env on the Pi. Set it with:" \
                 "gh secret set STAGING_SUPABASE_ANON_KEY"
            exit 1
          fi

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          # A separate package rather than a second tag on the production one:
          # nothing can then confuse a staging image for a production image, and
          # the auto-updater watching :latest here cannot see production's.
          images: ghcr.io/${{ github.repository_owner }}/badminton-${{ matrix.app }}-staging
          # IMMUTABLE TAG ONLY. `latest` — the moving tag the Pi's staging
          # containers track, and therefore the thing that actually deploys — is
          # moved by the `publish` job below, once, after BOTH matrix legs have
          # succeeded. Publishing it here made the two apps independent: admin
          # could fail while player's `latest` had already moved, leaving staging
          # running two different revisions of the same commit's pair.
          #
          # ONE tag, so `steps.meta.outputs.version` is exactly it and the
          # publish job below can be handed the real value instead of rebuilding
          # it. format=short is the default and is spelled out only so the tag
          # you see in GHCR matches what is written here; nothing depends on the
          # length, which DOCKER_METADATA_SHORT_SHA_LENGTH can change.
          tags: |
            type=sha,prefix=sha-,format=short

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile || 'Dockerfile' }}
          target: runner-${{ matrix.app }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Separate cache scope from production: sharing one would let a
          # production layer carrying production's Supabase URL be reused here.
          cache-from: type=gha,scope=staging-${{ matrix.app }}
          cache-to: type=gha,scope=staging-${{ matrix.app }},mode=max
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=https://badminton.polardev.org/supabase
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.STAGING_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_APP_URL=https://badminton.polardev.org
            NEXT_PUBLIC_PLAYER_URL=https://badminton.polardev.org
            NEXT_PUBLIC_ADMIN_URL=https://badminton.polardev.org/admin
            NEXT_PUBLIC_BASE_PATH=${{ matrix.base_path }}
            # The root Dockerfile compiles only this image's app (ignored by
            # the bot's and data API's own Dockerfiles).
            BUILD_APP=${{ matrix.app }}
            # Must be a registrable suffix of the staging origin. Scoping it to
            # the staging host also means a staging passkey cannot be asserted
            # against production, or the reverse.
            NEXT_PUBLIC_PASSKEY_RP_ID=badminton.polardev.org
            # Host-only cookie: both apps share this origin, so no cross-domain
            # scoping is needed — and an empty value here must match the player
            # build, or the two write same-named cookies on different scopes.
            NEXT_PUBLIC_AUTH_COOKIE_DOMAIN=
            # Sentry and PostHog intentionally unset — staging must not report
            # into production's telemetry. Leaving SENTRY_AUTH_TOKEN out also
            # means no source maps are uploaded for a throwaway build.
            NEXT_PUBLIC_SENTRY_DSN=
            NEXT_PUBLIC_POSTHOG_KEY=
            NEXT_PUBLIC_POSTHOG_HOST=

  # THE DEPLOY. Everything above only publishes immutable sha- tags, which
  # nothing on the Pi watches; moving `latest` is what the auto-updater sees, and
  # this job moves all of them or none. `needs: build` covers the whole
  # matrix, so one failed leg leaves EVERY staging deploy reference where it was
  # rather than half-advancing the set — which matters more now that the bot is
  # in it, because the bot and the player app talk to each other over a shared
  # secret and a half-advanced pair is exactly how you get a 401 loop that looks
  # like a misconfigured secret.
  #
  # imagetools create copies the existing manifest by digest — no rebuild, no
  # second arm64 build, and the bits behind :latest are byte-identical to the
  # sha- tag this commit already produced.
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Move :latest on all staging images
        env:
          OWNER: ${{ github.repository_owner }}
          # The tag the build job actually pushed, not a guess at how
          # metadata-action spells one. Reconstructing it from github.sha would
          # break silently the day the short-sha length changed: imagetools
          # would 404 on a tag nobody pushed, :latest would not move, and the
          # deploy would simply not happen.
          TAG: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "$TAG" ]; then
            echo "::error::build job produced no image tag; refusing to touch :latest"
            exit 1
          fi
          # GHCR paths are lowercase; github.repository_owner is not (PolarBaeJr).
          # metadata-action lowercases for us in the build job, so this is the one
          # place the raw value would have leaked through as a 404 on push.
          owner=$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')
          tag="$TAG"
          for app in player admin bot data-api data-api-rs; do
            image="ghcr.io/${owner}/badminton-${app}-staging"
            echo "promoting ${image}:${tag} -> ${image}:latest"
            docker buildx imagetools create -t "${image}:latest" "${image}:${tag}"
          done
