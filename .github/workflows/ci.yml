name: CI

# Type-check, lint and test the whole npm workspace. Until this existed the only
# workflow built Docker images, so a red test suite could — and did — reach
# production without anything objecting.
#
# Three ways in:
#   pull_request     — gate a PR before it can be merged into the prod branch
#   push release/**  — check a release train when it is pushed. The prod push
#                      that follows is the same commit, and build-images.yml
#                      skips its own run when this one passed for that commit
#   workflow_call    — build-images.yml calls this first, so an image is never
#                      built from a commit that failed (see that file's `verify`)
#
# Note the absence of a `push` trigger on deploy/docker-prod. A direct push there
# IS covered — build-images.yml calls this workflow before it builds. Adding a
# push trigger on top would start a second, identical run of this same workflow
# for the same commit, and the two would contend for the concurrency group
# below. Whether they collide depends on how `github.workflow` resolves inside a
# reusable call; if they do collide, cancel-in-progress kills one, and if the
# casualty is the `verify` job then `needs: verify` fails and the images never
# build. A deploy that silently does not ship is worse than the duplicate run,
# so the trigger is simply not here.
#
# Deliberately needs no secrets: the repo is public, so a PR from a fork gets
# none, and a check that only passes for the owner is a check people route
# around. `next build` was verified to succeed with no NEXT_PUBLIC_* set — the
# values only matter to the shipped bundle, not to whether the code compiles.
on:
  pull_request:
    branches:
      - deploy/docker-prod
  push:
    branches:
      - 'release/**'
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# One run per ref. Pushing twice to a PR branch cancels the older run rather
# than racing it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job id doubles as the status-check name branch protection has to match. On a
  # pull_request it reports as plain "checks" — that is the name to require.
  # Called from build-images.yml it reports as "verify / checks" instead.
  # Renaming this job silently detaches any required-check rule that names it.
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Read from .nvmrc so there is exactly one place to change the Node
          # version. It must stay in lockstep with the Dockerfile's
          # node:24-bookworm-slim, the root `engines.node`, and the @types/node
          # ^24 the apps compile against — otherwise CI type-checks against a
          # Node that never runs the app, which is how a missing global
          # (WebSocket, absent until Node 22) reached a production deploy.
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Cheap guard for the hand-mirrored edge-function constants, which no npm
      # task can reach — see the script for why.
      - name: Check edge-function constants have not drifted
        run: node .github/ci/check-shared-drift.mjs

      # No pipe, no `|| true`: the step's exit code has to be turbo's. Verified
      # locally that a failing vitest case, an eslint error and a tsc error each
      # exit non-zero (1, 1 and 2 respectively), and that a single failing
      # package fails the whole run.
      #
      # --continue reports every failing task instead of stopping at the first,
      # and still exits non-zero — confirmed. Without it one broken package
      # hides the rest and the fix takes several round trips.
      #
      # `type-check` dependsOn `build` in turbo.json, so this also builds both
      # Next apps and a broken build fails the job too. That is most of the wall
      # clock, and it is the reason `build` is not listed separately.
      #
      # apps/data-api-rs is Rust, built for arm64 only: data-api-rs.yml checks
      # it on an arm64 runner with its pinned toolchain, so it is left out here.
      - name: type-check, lint, test
        run: npx turbo run type-check lint test --continue --filter=!data-api-rs
