name: ClubLadder
options:
  bundleIdPrefix: com.clubladder
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
targets:
  ClubLadder:
    type: application
    platform: iOS
    sources:
      - path: ClubLadder
        excludes:
          - "Info.plist"
          - "ClubLadder.entitlements"
      - path: ../android/app/src/main/res/font
        name: Fonts
        buildPhase: resources
      - path: ../android/app/src/main/assets/licenses
        name: licenses
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.clubladder.app
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: ClubLadder/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: $(BADMINTON_ENTITLEMENTS_FILE)
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEAD_CODE_STRIPPING: YES
        ENABLE_PREVIEWS: NO
      configs:
        Release:
          SWIFT_OPTIMIZATION_LEVEL: -Osize
  ClubLadderTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ClubLadderTests
    dependencies:
      - target: ClubLadder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.clubladder.app.tests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/ClubLadder.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/ClubLadder
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  ClubLadder:
    build:
      targets:
        ClubLadder: all
        ClubLadderTests: [test]
    test:
      targets:
        - ClubLadderTests
